<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajukan SOP Baru — Sistem SOP SMK Muhada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" style="max-width:760px">
    <div class="page-header">
      <div>
        <h1 class="serif">Buat Draft SOP Baru</h1>
        <div class="sub">Draft dapat diedit sebelum diajukan untuk persetujuan Kepala Sekolah</div>
      </div>
    </div>

    <form id="form" class="card" style="display:flex;flex-direction:column;gap:16px">
      <div class="field">
        <label for="title">Judul SOP</label>
        <input id="title" required placeholder="mis. SOP Peminjaman Sarana &amp; Prasarana">
      </div>
      <div class="field" id="bidang-field">
        <label for="bidang">Bidang</label>
        <select id="bidang" required></select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
        <div class="field">
          <label for="preparer_name">Nama Penyusun</label>
          <input id="preparer_name" placeholder="Nama yang menyusun SOP ini">
        </div>
        <div class="field">
          <label for="checker_name">Nama Pemeriksa</label>
          <select id="checker_name">
            <option value="">— Pilih Pemeriksa —</option>
          </select>
          <div id="checker-hint" style="font-size:11.5px;color:var(--muted);display:none">Wajib diisi — Waka lain atau Kepala Sekolah</div>
        </div>
      </div>
      <div class="field">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <label style="margin-bottom:0">Isi SOP (Tujuan, Ruang Lingkup, Prosedur)</label>
          <button type="button" id="ai-generate-btn" class="btn btn-secondary" style="padding:7px 12px;font-size:12.5px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></svg>
            Buat Draf dengan AI
          </button>
        </div>
        <textarea id="ai-prompt" rows="2" placeholder="Instruksi tambahan untuk AI (opsional) — mis. tekankan langkah verifikasi berkas, sebutkan pihak yang terlibat, atau gaya penulisan tertentu" style="margin-bottom:10px"></textarea>
        <div class="editor-toolbar" id="toolbar"></div>
        <div id="content" class="rich-editor" contenteditable="true"></div>
        <div id="ai-status" style="font-size:12.5px;color:var(--muted);display:none;margin-top:6px"></div>
      </div>
      <div id="error" class="error-text" style="display:none"></div>
      <div style="display:flex;gap:10px">
        <a href="/sop-list.html" class="btn btn-secondary">Batal</a>
        <button type="submit" class="btn btn-primary">Simpan Draft</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/rich-editor.js"></script>
<script>
(async function () {
  const user = await renderSidebar();
  if (!user) return;

  const bidangSelect = document.getElementById("bidang");
  if (user.role === "kepala_sekolah") {
    const bidangNames = await fetchBidangNames();
    bidangSelect.innerHTML = bidangNames.map((b) => `<option value="${b}">${b}</option>`).join("");
  } else {
    bidangSelect.innerHTML = `<option value="${user.bidang}">${user.bidang}</option>`;
    bidangSelect.disabled = true;
  }
  document.getElementById("preparer_name").value = user.name;

  // "Nama Pemeriksa" adalah dropdown berisi akun bertingkat Waka ke atas
  // (Waka bidang yang sama, atau Kepala Sekolah) — bukan lagi ketik bebas,
  // dan bukan staf. Daftar diambil dari /api/users/directory, yang bisa
  // diakses semua peran (bukan cuma Kepala Sekolah seperti /api/users).
  //
  // Kalau yang mengajukan sendiri seorang Waka, ia tidak boleh meninjau
  // pengajuannya sendiri — jadi Pemeriksa wajib diisi dengan Waka LAIN atau
  // Kepala Sekolah (field dibuat wajib, dan server juga memvalidasi ulang).
  const checkerSelect = document.getElementById("checker_name");
  const directory = await api("/users/directory");
  function refreshCheckerOptions() {
    const currentBidang = bidangSelect.value;
    // Kalau pengaju sendiri seorang Waka, "Waka bidang yang sama" biasanya
    // cuma dirinya sendiri (satu bidang umumnya satu Waka) — jadi untuk
    // kasus ini, Waka bidang LAIN pun boleh jadi Pemeriksa, bukan cuma
    // Kepala Sekolah. Untuk staf/Kepala Sekolah yang membuat SOP, Pemeriksa
    // tetap dibatasi ke Waka bidang yang sama (atau Kepala Sekolah), karena
    // itu yang relevan meninjau isi SOP tersebut.
    const candidates = directory.filter(
      (u) =>
        u.id !== user.id &&
        (u.role === "kepala_sekolah" || (u.role === "waka" && (user.role === "waka" || u.bidang === currentBidang)))
    );
    checkerSelect.innerHTML =
      `<option value="">— Pilih Pemeriksa —</option>` +
      candidates
        .map((u) => `<option value="${u.id}">${u.name}${u.role === "waka" ? ` (Waka ${u.bidang})` : " (Kepala Sekolah)"}</option>`)
        .join("");
  }
  refreshCheckerOptions();
  bidangSelect.addEventListener("change", refreshCheckerOptions);

  if (user.role === "waka") {
    checkerSelect.required = true;
    const checkerHint = document.getElementById("checker-hint");
    if (checkerHint) checkerHint.style.display = "block";
  }

  const contentEl = document.getElementById("content");
  const toolbarEl = document.getElementById("toolbar");
  toolbarEl.innerHTML = richEditorToolbarHtml();
  wireRichEditorToolbar(toolbarEl, contentEl);

  document.getElementById("ai-generate-btn").addEventListener("click", async () => {
    const errorEl = document.getElementById("error");
    const statusEl = document.getElementById("ai-status");
    const btn = document.getElementById("ai-generate-btn");
    const titleVal = document.getElementById("title").value.trim();
    errorEl.style.display = "none";

    if (!titleVal) {
      errorEl.textContent = "Isi judul SOP terlebih dahulu sebelum membuat draf AI.";
      errorEl.style.display = "block";
      return;
    }
    if (contentEl.innerText.trim() && !confirm("Isi SOP saat ini akan diganti dengan draf dari AI. Lanjutkan?")) {
      return;
    }

    btn.disabled = true;
    statusEl.style.display = "block";
    statusEl.textContent = "AI sedang menyusun draf…";

    try {
      const instruksiVal = document.getElementById("ai-prompt").value.trim();
      const result = await api("/sop/generate-ai", {
        method: "POST",
        body: JSON.stringify({ title: titleVal, bidang: bidangSelect.value, instruksi: instruksiVal || undefined }),
      });
      contentEl.innerHTML = autoFormatSopHtml(result.content);
      statusEl.textContent = "Draf dibuat oleh AI — tinjau dan sesuaikan sebelum diajukan.";
    } catch (err) {
      statusEl.style.display = "none";
      errorEl.textContent = err.message;
      errorEl.style.display = "block";
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("error");
    errorEl.style.display = "none";
    try {
      const checkerId = checkerSelect.value ? Number(checkerSelect.value) : null;
      const checkerUser = checkerId ? directory.find((u) => u.id === checkerId) : null;
      const result = await api("/sop", {
        method: "POST",
        body: JSON.stringify({
          title: document.getElementById("title").value,
          bidang: bidangSelect.value,
          content: contentEl.innerHTML,
          preparer_name: document.getElementById("preparer_name").value,
          checker_name: checkerUser ? checkerUser.name : "",
          checker_user_id: checkerId,
        }),
      });
      window.location.href = `/sop-detail.html?id=${result.id}`;
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = "block";
    }
  });
})();
</script>
</body>
</html>
