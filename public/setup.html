<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup Awal — Sistem SOP SMK Muhada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="setup-form">
    <div>
      <h1 class="serif" style="margin:0;font-size:22px;font-weight:600">Setup Awal</h1>
      <div style="color:var(--muted);font-size:13px;margin-top:4px">
        Buat akun Kepala Sekolah pertama. Halaman ini hanya bisa dipakai satu kali —
        setelah akun pertama dibuat, halaman ini otomatis menolak dan Anda login lewat
        <a href="/index.html">halaman login</a> seperti biasa.
      </div>
    </div>

    <div class="field">
      <label for="name">Nama Lengkap</label>
      <input id="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" required>
    </div>
    <div class="field">
      <label for="password">Password (min. 8 karakter)</label>
      <input id="password" type="password" minlength="8" required>
    </div>

    <div id="error" class="error-text" style="display:none"></div>
    <div id="success" style="display:none;color:var(--primary);font-size:13px;font-weight:600"></div>

    <button type="submit" class="btn btn-primary" style="justify-content:center" id="submit-btn">Buat Akun Kepala Sekolah</button>
  </form>
</div>

<script>
  document.getElementById("setup-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("error");
    const successEl = document.getElementById("success");
    const btn = document.getElementById("submit-btn");
    errorEl.style.display = "none";
    successEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Memproses…";
    try {
      const res = await fetch("/api/auth/setup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Gagal membuat akun.");
      successEl.textContent = "Akun berhasil dibuat! Mengalihkan ke halaman login…";
      successEl.style.display = "block";
      setTimeout(() => (window.location.href = "/index.html"), 1500);
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Buat Akun Kepala Sekolah";
    }
  });
</script>
</body>
</html>
