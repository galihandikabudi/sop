<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengguna — Sistem SOP SMK Muhada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="page-header">
      <div>
        <h1 class="serif">Pengguna</h1>
        <div class="sub">Akun staf per bidang yang dapat mengajukan &amp; membaca SOP</div>
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start">
      <div class="card" style="padding:0;overflow:hidden">
        <table>
          <thead><tr><th>Nama</th><th>Email</th><th>Bidang</th><th>Peran</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

      <form id="form" class="card" style="display:flex;flex-direction:column;gap:14px">
        <div style="font-weight:700;font-size:15px">Tambah Akun Staf</div>
        <div class="field">
          <label for="name">Nama</label>
          <input id="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" required>
        </div>
        <div class="field">
          <label for="bidang">Bidang</label>
          <select id="bidang" required></select>
        </div>
        <div class="field">
          <label for="password">Password Awal</label>
          <input id="password" type="password" required minlength="8">
        </div>
        <div id="error" class="error-text" style="display:none"></div>
        <button type="submit" class="btn btn-primary">Buat Akun</button>
      </form>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/users.js"></script>
</body>
</html>
