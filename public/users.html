<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengguna — Sistem SOP SMK Muhada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="page-header">
      <div>
        <h1 class="serif">Pengguna</h1>
        <div class="sub">Akun staf per bidang yang dapat mengajukan &amp; membaca SOP</div>
      </div>
      <button class="btn btn-primary" id="add-btn">+ Tambah Akun</button>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <table>
        <thead><tr><th>Nama</th><th>Email</th><th>Bidang</th><th>Peran</th><th style="text-align:right">Aksi</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <form id="form" class="modal-card">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-weight:700;font-size:16px" id="form-title">Tambah Akun</div>
      <button type="button" id="modal-close-btn" style="background:none;border:none;font-size:20px;line-height:1;color:var(--muted);padding:0">&times;</button>
    </div>
    <div class="field">
      <label for="role">Peran</label>
      <select id="role" required>
        <option value="staff">Staf (mengajukan &amp; membaca SOP)</option>
        <option value="waka">Waka Bidang (meninjau sebelum ke Kepala Sekolah)</option>
        <option value="kepala_sekolah">Kepala Sekolah (admin)</option>
      </select>
    </div>
    <div class="field">
      <label for="name">Nama</label>
      <input id="name" required>
    </div>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" required>
    </div>
    <div class="field" id="bidang-field">
      <label for="bidang">Bidang</label>
      <select id="bidang" required></select>
    </div>
    <div class="field">
      <label for="password" id="password-label">Password Awal</label>
      <input id="password" type="password" minlength="8">
    </div>
    <div id="error" class="error-text" style="display:none"></div>
    <div style="display:flex;gap:10px;margin-top:4px">
      <button type="submit" class="btn btn-primary" id="submit-btn" style="flex:1;justify-content:center">Buat Akun</button>
      <button type="button" class="btn btn-danger" id="delete-btn" style="display:none">Hapus Akun</button>
    </div>
  </form>
</div>

<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/users.js"></script>
</body>
</html>
