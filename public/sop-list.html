<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daftar SOP — Sistem SOP SMK Muhada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="page-header">
      <div>
        <h1 class="serif">Daftar SOP</h1>
        <div class="sub" id="sub-count"></div>
      </div>
      <a href="/sop-new.html" class="btn btn-primary">+ Ajukan SOP Baru</a>
    </div>

    <div style="display:flex;gap:12px">
      <input id="search" type="text" placeholder="Cari judul SOP…" class="card" style="flex:1;border:1px solid var(--border);padding:10px 14px">
      <select id="filter-status" class="card" style="border:1px solid var(--border);padding:10px 14px">
        <option value="">Semua Status</option>
        <option value="draft">Draft</option>
        <option value="menunggu_persetujuan">Menunggu ACC</option>
        <option value="berlaku">Berlaku</option>
        <option value="ditolak">Ditolak</option>
      </select>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <table>
        <thead>
          <tr><th>Judul SOP</th><th>Bidang</th><th>Versi</th><th>Status</th><th>Berlaku Mulai</th><th>Diperbarui</th><th></th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/sop-list.js"></script>
</body>
</html>
