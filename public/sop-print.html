<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cetak SOP — Sistem SOP SMK Muhada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<link rel="stylesheet" href="/css/print.css">
<style>
  body { background: #DCD8CC; }
  .print-toolbar {
    max-width: 210mm; margin: 0 auto; padding: 16px 0; display: flex;
    justify-content: space-between; align-items: center;
  }
  #status-msg { max-width: 210mm; margin: 0 auto; padding: 40px 16px; color: #5B6663; font-size: 13.5px; }
  /* Paged.js renders each page as a boxed .pagedjs_page — give the
     preview a card-like look on screen; print styles come from print.css
     (@page rules) and are applied by the browser directly when printing. */
  .pagedjs_pages { display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .pagedjs_page {
    background: #fff; box-shadow: 0 2px 16px rgba(0,0,0,.15); margin: 0 !important;
  }
  @media print {
    body { background: #fff; }
    .no-print { display: none !important; }
    .pagedjs_pages { gap: 0; }
    .pagedjs_page { box-shadow: none !important; }
  }
</style>
</head>
<body>
<div class="print-toolbar no-print">
  <a id="back-link" href="/sop-list.html" class="btn btn-secondary">← Kembali</a>
  <button id="print-btn" onclick="window.print()" class="btn btn-primary" disabled>Menyiapkan dokumen…</button>
</div>

<div id="status-msg">Memuat dokumen…</div>
<div id="paged-container"></div>

<script src="/js/api.js"></script>
<script src="/js/rich-editor.js"></script>
<script type="module">
  import { Previewer } from "https://unpkg.com/pagedjs/dist/paged.esm.js";

  (async function () {
    const id = new URLSearchParams(window.location.search).get("id");
    const statusMsg = document.getElementById("status-msg");
    const backLink = document.getElementById("back-link");
    backLink.href = id ? `/sop-detail.html?id=${id}` : "/sop-list.html";

    try {
      await api("/auth/me");
    } catch {
      window.location.href = "/index.html";
      return;
    }

    let sop;
    try {
      sop = await api(`/sop/${id}`);
    } catch (err) {
      statusMsg.textContent = err.message;
      return;
    }

    // doc_number is assigned once, the first time an SOP is disahkan (see
    // lib/docNumber.js). SOPs approved before that feature existed won't
    // have one — fall back to the old plain format for those so nothing
    // breaks on already-printed/older documents.
    const year = sop.created_at ? new Date(sop.created_at).getFullYear() : new Date().getFullYear();
    const docNumber = sop.doc_number || `SOP/${String(sop.id).padStart(4, "0")}/SMK-MUHADA/${year}`;
    // Points at the public, no-login-required page so anyone scanning the
    // printed document (not just logged-in staff) can immediately check
    // they're reading the current version.
    const onlineUrl = `${window.location.origin}/sop-public.html?id=${sop.id}`;
    const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=140x140&margin=0&data=${encodeURIComponent(onlineUrl)}`;

    const approvalVersion = (sop.versions || []).find((v) => v.status === "berlaku");
    const kepalaSekolahName = (approvalVersion && approvalVersion.actor_name) || sop.kepalaSekolahName || "(Nama & Tanda Tangan)";
    const preparerName = sop.preparer_name || sop.created_by_name;
    const checkerName = sop.checker_name || "(Nama & Tanda Tangan)";

    const sheetHtml = `
      <div class="doc-header">
        <div class="doc-header-left">
          <div class="doc-school-name">SMK MUHAMMADIYAH TODANAN</div>
          <div class="doc-school-sub">Majelis Dikdasmen PNF PDM Kabupaten Blora</div>
          <div class="doc-title">Dokumen Mutu — Standar Operasional Prosedur</div>
        </div>
        <div class="doc-header-right">
          <div class="doc-meta-row">No. Dokumen: ${docNumber}</div>
          <div class="doc-meta-row">Bidang: ${sop.bidang}</div>
          <div class="doc-meta-row">Revisi / Versi: ${sop.version}</div>
          <div class="doc-meta-row">Berlaku Mulai: ${sop.valid_from ? fmtDate(sop.valid_from) : "—"}</div>
        </div>
        <div class="doc-header-qr">
          <img id="qr-img" src="${qrSrc}" alt="QR versi online">
          <div class="qr-caption" id="qr-fallback" style="display:none;word-break:break-all">${onlineUrl}</div>
        </div>
      </div>

      <div class="sop-title-line">${sop.title}</div>

      <div class="rich-content">${toDisplayHtml(sop.content) || "<p style='color:#5B6663'>(Belum ada isi.)</p>"}</div>

      <div class="sign-grid">
        <div class="sign-box">
          <div class="role">Disusun oleh</div>
          <div class="name">${preparerName}</div>
          <div class="sub">${sop.bidang}</div>
        </div>
        <div class="sign-box">
          <div class="role">Diperiksa oleh</div>
          <div class="name">${checkerName}</div>
          <div class="sub">Waka Terkait</div>
        </div>
        <div class="sign-box">
          <div class="role">Disahkan oleh</div>
          <div class="name">${kepalaSekolahName}</div>
          <div class="sub">Kepala Sekolah</div>
        </div>
      </div>
    `;

    statusMsg.textContent = "Menyusun halaman untuk cetak…";

    const previewer = new Previewer();
    await previewer.preview(sheetHtml, ["/css/style.css", "/css/print.css"], document.getElementById("paged-container"));

    statusMsg.style.display = "none";
    const printBtn = document.getElementById("print-btn");
    printBtn.disabled = false;
    printBtn.textContent = "Cetak / Simpan sebagai PDF";

    const qrImg = document.getElementById("qr-img");
    if (qrImg) {
      qrImg.addEventListener("error", () => {
        qrImg.style.display = "none";
        document.getElementById("qr-fallback").style.display = "block";
      });
    }
  })();
</script>
</body>
</html>
