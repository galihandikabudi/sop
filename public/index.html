<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk — Sistem SOP SMK Muhada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="login-form">
    <div>
      <h1 class="serif" style="margin:0;font-size:22px;font-weight:600">SOP Muhada</h1>
      <div style="color:var(--muted);font-size:13px;margin-top:4px">SMK Muhammadiyah Todanan — Sistem Manajemen SOP</div>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" type="password" required autocomplete="current-password">
    </div>

    <div id="error" class="error-text" style="display:none"></div>

    <button type="submit" class="btn btn-primary" style="justify-content:center" id="submit-btn">Masuk</button>
  </form>
</div>

<script src="/js/api.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById("error");
    const btn = document.getElementById("submit-btn");
    errorEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = "Memproses…";
    try {
      await api("/auth/login", {
        method: "POST",
        body: JSON.stringify({
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
        }),
      });
      window.location.href = "/dashboard.html";
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.style.display = "block";
      btn.disabled = false;
      btn.textContent = "Masuk";
    }
  });
</script>
</body>
</html>
