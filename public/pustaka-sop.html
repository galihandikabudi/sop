<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pustaka SOP — Sistem SOP SMK Muhada</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main">
    <div class="page-header">
      <div>
        <h1 class="serif">Pustaka SOP</h1>
        <div class="sub" id="sub-count">SOP resmi yang sudah disahkan dan berlaku — dapat diakses semua guru dan staf, lintas bidang</div>
      </div>
    </div>

    <div style="display:flex;gap:12px">
      <input id="search" type="text" placeholder="Cari judul SOP…" class="card" style="flex:1;border:1px solid var(--border);padding:10px 14px">
      <select id="filter-bidang" class="card" style="border:1px solid var(--border);padding:10px 14px">
        <option value="">Semua Bidang</option>
      </select>
    </div>

    <div class="card" style="padding:0;overflow:hidden">
      <table>
        <thead>
          <tr><th>Judul SOP</th><th>Bidang</th><th>No. Dokumen</th><th>Versi</th><th>Berlaku Mulai</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/pustaka-sop.js"></script>
</body>
</html>
